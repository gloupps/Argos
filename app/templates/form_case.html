<form data-case-form class="p-6 space-y-6">
    <input type="hidden" name="source_mode" id="source-mode" value="ioc">

    <!-- Case configuration — hidden when mode = "db" -->
    <div id="case-config-section" class="glass p-5 rounded-xl space-y-5 border-l-4 border-blue-500">
        <h2 class="text-sm font-bold flex items-center gap-2">
            <i data-lucide="briefcase" class="w-4 h-4 text-blue-500"></i> Case Configuration
        </h2>

        <div id="case-name-wrap">
            <label class="text-xs text-slate-400">Case Name</label>
            <input name="case_name" type="text" required
                   placeholder="Ex: Phishing infra — May 2026"
                   class="argos-input mt-1">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 pt-1">
            <label class="flex items-center justify-between text-xs bg-slate-900 p-3 rounded
                          border border-slate-800 cursor-pointer hover:border-slate-600 transition">
                <span class="flex items-center gap-1.5">
                    <i data-lucide="zap" class="w-3 h-3 text-purple-400"></i> Auto Qualify Root IOCs
                </span>
                <input type="checkbox" name="auto_enrich" checked class="accent-purple-500">
            </label>
            <label class="flex items-center justify-between text-xs bg-slate-900 p-3 rounded
                          border border-slate-800 cursor-pointer hover:border-slate-600 transition">
                <span class="flex items-center gap-1.5">
                    <i data-lucide="database" class="w-3 h-3 text-blue-400"></i> SIEM
                </span>
                <input type="checkbox" name="siem" class="accent-blue-500">
            </label>
            <label class="flex items-center justify-between text-xs bg-slate-900 p-3 rounded
                          border border-slate-800 cursor-pointer hover:border-slate-600 transition">
                <span class="flex items-center gap-1.5">
                    <i data-lucide="share-2" class="w-3 h-3 text-amber-400"></i> Correlation
                </span>
                <input type="checkbox" name="correlation" checked class="accent-amber-500">
            </label>
        </div>
    </div>

    <!-- Data sources -->
    <div class="glass p-5 rounded-xl space-y-4 border-l-4 border-green-500">
        <h2 class="text-sm font-bold flex items-center gap-2">
            <i data-lucide="database" class="w-4 h-4 text-green-500"></i> Data Sources
        </h2>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs">
            <button type="button" class="mode-btn bg-slate-800 hover:bg-slate-700 p-3 rounded-lg
                                         border border-slate-700 transition font-semibold"
                    data-mode="internal_source">🌐 Internal Source</button>
            <button type="button" class="mode-btn bg-slate-800 hover:bg-slate-700 p-3 rounded-lg
                                         border border-slate-700 transition font-semibold"
                    data-mode="ioc">🎯 IOC</button>
            <button type="button" class="mode-btn bg-slate-800 hover:bg-slate-700 p-3 rounded-lg
                                         border border-slate-700 transition font-semibold"
                    data-mode="file">📦 STIX2</button>
            <button type="button" class="mode-btn bg-slate-800 hover:bg-slate-700 p-3 rounded-lg
                                         border border-slate-700 transition font-semibold"
                    data-mode="db">📂 Existing</button>
        </div>

        <div>
            <div id="form-internal_source" class="form-section hidden space-y-3">
                <div>
                    <label class="text-[10px] text-slate-500 uppercase tracking-wider mb-1 block">
                        Source Type
                    </label>
                    <div class="flex gap-2">
                        <label class="flex items-center gap-2 text-xs cursor-pointer">
                            <input type="radio" name="internal_source_type" value="opencti" checked
                                   class="accent-blue-500"> OpenCTI
                        </label>
                        <label class="flex items-center gap-2 text-xs cursor-pointer">
                            <input type="radio" name="internal_source_type" value="misp"
                                   class="accent-blue-500"> MISP
                        </label>
                    </div>
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 uppercase tracking-wider mb-1 block">
                        Instance URL (report/event/list)
                    </label>
                    <input name="internal_source_url" type="text"
                           placeholder="https://opencti.local/reports/… or https://misp.local/events/view/42"
                           class="argos-input mt-1">
                </div>
                <p class="text-[10px] text-slate-600 italic">
                    Uses the API key configured in Settings for the selected source.
                    Indicators will be extracted and added as root IOCs.
                </p>
            </div>
            <div id="form-ioc" class="form-section hidden">
                <label class="text-[10px] text-slate-500 uppercase tracking-wider mb-1 block">
                    One IOC per line — IP, domain, hash, URL
                </label>
                <textarea name="ioc_list" rows="7"
                          placeholder="1.1.1.1&#10;evil.example.com&#10;d41d8cd98f00b204e9800998ecf8427e"
                          class="argos-input mt-1"></textarea>
            </div>
            <div id="form-file" class="form-section hidden space-y-2">
                <label class="text-[10px] text-slate-500 uppercase tracking-wider mb-1 block">
                    STIX2 Bundle (.json) — indicators only
                </label>
                <input name="stix_file" id="stix-file-input" type="file" accept=".json"
                       class="argos-input mt-1">
                <div id="stix-preview" class="hidden text-[10px] text-slate-400 bg-slate-900/50 
                                               rounded p-2 border border-slate-800">
                    <!-- rempli par JS -->
                </div>
            </div>
            <div id="form-db" class="form-section hidden">
                <label class="text-[10px] text-slate-500 uppercase tracking-wider mb-1 block">
                    Select an existing case to reopen
                </label>
                <select name="existing_case"
                        class="argos-input mt-1">
                    <option value="">— Select a case —</option>
                    {% for case in existing_cases %}
                        <option value="{{ case.id }}">{{ case.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
    </div>

    <div class="flex justify-end">
        <button type="submit" data-action="new-case"
                class="argos-btn argos-btn-primary disabled:opacity-40">
            <i data-lucide="play" class="w-4 h-4"></i> Create Case
        </button>
    </div>
</form>
