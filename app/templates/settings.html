<div id="settings-modal"
     class="hidden fixed inset-0 argos-modal-overlay flex items-center justify-center z-50">
    <div class="argos-modal w-[95vw] max-w-[1100px] max-h-[90vh] overflow-y-auto p-6 space-y-6">

        <!-- Header -->
        <div class="flex items-center justify-between">
            <h2 class="text-base font-bold flex items-center gap-2" style="color:var(--gold-main)">
                <i data-lucide="settings" class="w-5 h-5"></i> Settings
            </h2>
            <button data-action="close-settings" class="argos-btn-icon">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Decorative separator -->
        <div class="argos-divider"></div>

        <!-- API Keys + Quotas -->
        <section>
            <div class="argos-section-header mb-4" style="padding-left:0">API Keys</div>
            <div id="settings-keys" class="space-y-3"></div>
        </section>

        <!-- Save -->
        <div class="flex justify-end pt-3" style="border-top: 1px solid var(--border-default)">
            <button data-action="save-settings" class="argos-btn argos-btn-primary">
                <i data-lucide="save" class="w-4 h-4"></i> Save
            </button>
        </div>

    </div>
</div>
