<aside class="w-64 border-r border-slate-800 flex flex-col glass overflow-y-auto">

    <!-- Logo + Settings -->
    <div class="flex items-center px-4 py-3 border-b border-slate-800 shrink-0">

        <!-- Logo -->
        <div class="flex-1 flex items-center">
            <img class="h-20 w-auto object-contain"
                src="{{ url_for('static', filename='images/logo.gif') }}"
                alt="PivotLens">
        </div>

        <!-- Settings -->
        <button class="ml-3 p-1.5 hover:bg-slate-700 rounded-lg transition text-slate-400 hover:text-white shrink-0"
                data-action="open-settings"
                title="Settings">
            <i data-lucide="settings" class="w-4 h-4"></i>
        </button>

    </div>

    <div class="p-4 space-y-5 flex-1">

        <!-- Internal sources -->
        <section>
            <h3 class="text-xs font-semibold text-slate-500 uppercase mb-3 tracking-wider">
                Internal Sources
            </h3>
            <div id="modules-internal" class="space-y-1 text-sm"></div>
        </section>

        <!-- External sources -->
        <section>
            <h3 class="text-xs font-semibold text-slate-500 uppercase mb-3 tracking-wider">
                External Sources
            </h3>
            <div id="modules-external" class="space-y-1 text-sm"></div>
        </section>

    </div>
</aside>
