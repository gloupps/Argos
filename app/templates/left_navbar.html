<aside class="argos-left w-64 flex flex-col overflow-y-auto" style="width:var(--sidebar-width,260px)">

    <!-- Logo + Controls -->
    <div class="argos-logo-zone flex items-center gap-2 shrink-0">
        <div class="flex items-center">
            <img id="argos-logo-img"
                 class="argos-logo-img object-contain"
                 src="{{ url_for('static', filename='images/argos-logo-full.svg') }}"
                 data-dark="{{ url_for('static', filename='images/argos-logo-full.svg') }}"
                 data-light="{{ url_for('static', filename='images/argos-logo-full-light.svg') }}"
                 alt="Argos">
        </div>

        <!-- Theme toggle -->
        <button class="argos-theme-toggle shrink-0" id="argos-theme-btn" onclick="ArgosTheme.toggle()" title="Toggle dark/light mode">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </button>

        <!-- Settings -->
        <button class="argos-btn-icon shrink-0 ml-1"
                data-action="open-settings"
                title="Settings">
            <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
    </div>

    <div class="p-3 space-y-5 flex-1">

        <!-- Internal sources -->
        <section>
            <div class="argos-section-header">Internal Sources</div>
            <div id="modules-internal" class="space-y-0.5 text-sm"></div>
        </section>

        <!-- External sources -->
        <section>
            <div class="argos-section-header">External Sources</div>
            <div id="modules-external" class="space-y-0.5 text-sm"></div>
        </section>

    </div>
</aside>

<script>
window.ArgosTheme = {
    toggle() {
        const html = document.documentElement;
        const current = html.getAttribute('data-theme') || 'dark';
        const next = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('argos-theme', next);
        this._applyLogo(next);
        document.dispatchEvent(new CustomEvent('argos:theme-changed', { detail: { theme: next } }));
    },
    _applyLogo(theme) {
        const img = document.getElementById('argos-logo-img');
        if (!img) return;
        img.src = theme === 'light' ? img.dataset.light : img.dataset.dark;
    }
};
(function() {
    const t = localStorage.getItem('argos-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
    // Apply logo on init after DOM ready
    document.addEventListener('DOMContentLoaded', () => ArgosTheme._applyLogo(t), { once: true });
})();
</script>
