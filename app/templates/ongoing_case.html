<div class="p-6 space-y-4 relative">

    <!-- ══════════════════════════════════════════════════ -->
    <!-- ROW 1 : Active Case (pleine largeur)              -->
    <!-- ══════════════════════════════════════════════════ -->
    <div class="argos-card argos-card-accent p-5">
        <p class="text-[10px] text-slate-400 uppercase font-bold mb-2 tracking-widest">Active case</p>

        <div class="flex items-center gap-2 mb-2">
            <h1 id="case-name-display"
                class="text-xl font-bold cursor-pointer hover:text-blue-300 transition"
                title="Click to rename"
                onclick="CaseHeader.startRename()">{{ case_name }}</h1>

            <input id="case-name-input"
                   class="hidden text-xl font-bold bg-transparent border-b border-blue-500
                          outline-none text-white w-full max-w-sm"
                   type="text" value="{{ case_name }}">

            <div id="case-name-actions" class="hidden flex items-center gap-1">
                <button onclick="CaseHeader.confirmRename()"
                        class="p-1 text-green-400 hover:text-green-300">
                    <i data-lucide="check" class="w-4 h-4"></i>
                </button>
                <button onclick="CaseHeader.cancelRename()"
                        class="p-1 text-slate-500 hover:text-slate-300">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <div id="case-id-value" data-case-id="{{ case_id }}" class="hidden"></div>

        <div class="flex flex-wrap gap-2 mt-3">
            <button onclick="CaseActions.undo('{{ case_id }}')"
                    class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700
                           px-3 py-1.5 rounded text-xs font-medium transition text-slate-300">
                <i data-lucide="undo-2" class="w-3.5 h-3.5"></i> Undo
            </button>
            <button onclick="CaseActions.exportStix('{{ case_id }}')"
                    class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700
                           px-3 py-1.5 rounded text-xs font-medium transition text-slate-300">
                <i data-lucide="download" class="w-3.5 h-3.5"></i> Export STIX
            </button>
            <button onclick="CaseReport.generate('{{ case_id }}')"
                    class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700
                           px-3 py-1.5 rounded text-xs font-medium transition text-blue-400">
                <i data-lucide="file-text" class="w-3.5 h-3.5"></i> Export PDF
            </button>
            <button onclick="CaseActions.deleteCase('{{ case_id }}')"
                    class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700
                           px-3 py-1.5 rounded text-xs font-medium transition text-red-400 hover:text-white"
                    title="Delete this case">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Delete
            </button>
            <span class="ml-auto flex items-center gap-1.5 text-[9px] text-slate-600 italic">
                <i data-lucide="mouse-pointer-2" class="w-3 h-3"></i>
                Right-click node for actions · Hold &amp; drag to link
            </span>
        </div>
    </div>

    <!-- ══════════════════════════════════════════════════ -->
    <!-- ROW 2 : Correlation Graph                         -->
    <!-- ══════════════════════════════════════════════════ -->
    <div class="glass rounded-xl p-4">
        <!-- Header -->
        <div class="flex justify-between items-center mb-2">
            <h3 class="text-sm font-bold flex items-center gap-2">
                <i data-lucide="network" class="w-4 h-4 text-blue-400"></i> Correlation Graph
            </h3>
            <div class="flex gap-3 text-[10px] text-slate-500">
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-red-500 inline-block"></span> Root</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-cyan-500 inline-block"></span> Pivot</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-500 inline-block"></span> Pivoted IOC</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-violet-500 inline-block"></span> Correlated IOC</span>
            </div>
        </div>

        <!-- Graph toolbar -->
        <div class="flex items-center gap-1 mb-2 flex-wrap">
            <!-- Layout buttons -->
            <div class="flex items-center gap-0.5 bg-slate-900/60 border border-slate-700/50 rounded-lg p-0.5">
                <button onclick="GraphModule.applyLayout(App?.state?.activeTab, 'force')"
                        title="Re-apply force layout"
                        class="graph-tool-btn flex items-center gap-1 px-2 py-1 rounded text-slate-400 hover:text-blue-400 hover:bg-blue-500/10 transition text-[10px]">
                    <i data-lucide="atom" class="w-3 h-3"></i>
                    <span class="hidden sm:inline">Force</span>
                </button>
                <button onclick="GraphModule.applyLayout(App?.state?.activeTab, 'tree')"
                        title="Tree layout (horizontal)"
                        class="graph-tool-btn flex items-center gap-1 px-2 py-1 rounded text-slate-400 hover:text-cyan-400 hover:bg-cyan-500/10 transition text-[10px]">
                    <i data-lucide="git-branch" class="w-3 h-3"></i>
                    <span class="hidden sm:inline">Tree</span>
                </button>
                <button onclick="GraphModule.applyLayout(App?.state?.activeTab, 'dag')"
                        title="Genealogy tree (top-down)"
                        class="graph-tool-btn flex items-center gap-1 px-2 py-1 rounded text-slate-400 hover:text-violet-400 hover:bg-violet-500/10 transition text-[10px]">
                    <i data-lucide="git-fork" class="w-3 h-3"></i>
                    <span class="hidden sm:inline">DAG</span>
                </button>
                <button onclick="GraphModule.applyLayout(App?.state?.activeTab, 'circle')"
                        title="Circle layout"
                        class="graph-tool-btn flex items-center gap-1 px-2 py-1 rounded text-slate-400 hover:text-amber-400 hover:bg-amber-500/10 transition text-[10px]">
                    <i data-lucide="circle-dashed" class="w-3 h-3"></i>
                    <span class="hidden sm:inline">Circle</span>
                </button>
            </div>

            <!-- Separator -->
            <div class="w-px h-5 bg-slate-700/50 mx-0.5"></div>

            <!-- Fit / Center -->
            <button onclick="GraphModule.fitGraph(App?.state?.activeTab)"
                    title="Fit graph to view"
                    class="graph-tool-btn flex items-center gap-1 px-2 py-1 rounded bg-slate-900/60 border border-slate-700/50 text-slate-400 hover:text-green-400 hover:bg-green-500/10 transition text-[10px]">
                <i data-lucide="scan" class="w-3 h-3"></i>
                <span class="hidden sm:inline">Fit</span>
            </button>

            <!-- Search toggle -->
            <button onclick="document.getElementById('graph-search-bar').classList.toggle('hidden'); document.getElementById('graph-search-input').focus();"
                    title="Search nodes (Ctrl+F)"
                    class="graph-tool-btn flex items-center gap-1 px-2 py-1 rounded bg-slate-900/60 border border-slate-700/50 text-slate-400 hover:text-yellow-400 hover:bg-yellow-500/10 transition text-[10px]">
                <i data-lucide="search" class="w-3 h-3"></i>
                <span class="hidden sm:inline">Search</span>
            </button>
        </div>

        <!-- Search bar (hidden by default) -->
        <div id="graph-search-bar" class="hidden mb-2 flex items-center gap-2 bg-slate-900/60 border border-slate-700/50 rounded-lg px-2 py-1">
            <i data-lucide="search" class="w-3 h-3 text-slate-500 shrink-0"></i>
            <input id="graph-search-input"
                   type="text"
                   placeholder="Search nodes…"
                   class="flex-1 bg-transparent text-xs text-slate-200 outline-none placeholder-slate-600"
                   oninput="GraphModule.searchNodes(App?.state?.activeTab, this.value)"
                   onkeydown="if(event.key==='Escape'){ GraphModule.clearSearch(App?.state?.activeTab); document.getElementById('graph-search-bar').classList.add('hidden'); this.value=''; }">
            <button onclick="GraphModule.clearSearch(App?.state?.activeTab); document.getElementById('graph-search-input').value=''; document.getElementById('graph-search-bar').classList.add('hidden');"
                    class="text-slate-600 hover:text-slate-300 transition">
                <i data-lucide="x" class="w-3 h-3"></i>
            </button>
        </div>

        <!-- Canvas -->
        <div class="relative">
            <div id="cy"></div>
            <button id="graph-expand-btn"
                    onclick="GraphModule.toggleFullscreen(App?.state?.activeTab)"
                    title="Toggle fullscreen graph"
                    class="absolute bottom-2 right-2 z-10 text-slate-500 hover:text-blue-400 transition
                        bg-slate-900/80 backdrop-blur-sm border border-slate-700 rounded p-1">
                <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
            </button>
        </div>
    </div>

    <!-- ══════════════════════════════════════════════════ -->
    <!-- ROW 3 : Enrichment                                -->
    <!-- ══════════════════════════════════════════════════ -->
    <div class="glass rounded-xl p-4">
        <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-bold flex items-center gap-2">
                <i data-lucide="zap" class="w-4 h-4 text-green-400"></i> Enrichment
            </h3>
            <!-- Grid column selector -->
            <div class="flex items-center gap-2">
                <!-- Compare button -->
                <button id="compare-ioc-btn"
                        onclick="EnrichPanel._startCompare()"
                        title="Compare with another IOC"
                        class="flex items-center gap-1 px-2 py-1 rounded bg-slate-900 border border-slate-700/60
                            text-slate-500 hover:text-violet-400 hover:border-violet-500/40 transition text-xs">
                    <i data-lucide="diff" class="w-3 h-3"></i>
                    <span class="hidden sm:inline">Compare</span>
                </button>
                <!-- Grid selector -->
                <div class="flex items-center gap-0.5 bg-slate-900 border border-slate-700/60 rounded-lg p-0.5">
                    <button id="enrich-col-1" onclick="EnrichPanel._setGridCols(1)"
                            class="enrich-col-btn px-2 py-1 rounded transition" title="1 column">
                        <i data-lucide="square" class="w-3 h-3"></i>
                    </button>
                    <button id="enrich-col-2" onclick="EnrichPanel._setGridCols(2)"
                            class="enrich-col-btn px-2 py-1 rounded transition" title="2 columns">
                        <i data-lucide="columns-2" class="w-3 h-3"></i>
                    </button>
                    <button id="enrich-col-3" onclick="EnrichPanel._setGridCols(3)"
                            class="enrich-col-btn px-2 py-1 rounded transition" title="3 columns">
                        <i data-lucide="columns-3" class="w-3 h-3"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="qualif-header" class="mb-2">
            <p class="text-slate-600 text-xs italic">Right-click a node to enrich it.</p>
        </div>

        <!-- Grille : chaque box thème est un enfant direct -->
        <div id="enrich-grid" class="grid gap-2 grid-cols-1">
            <!-- boxes injectées par JS -->
        </div>
    </div>
    
    <!-- ══════════════════════════════════════════════════════════════════════════ -->
    <!-- ROW 4 : SIEM Investigation                                               -->
    <!-- Coller dans ongoing_case.html après ROW 3 (Enrichment)                  -->
    <!-- ══════════════════════════════════════════════════════════════════════════ -->

    <div class="glass rounded-xl p-4" id="siem-row">
        <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-bold flex items-center gap-2">
                <i data-lucide="database" class="w-4 h-4 text-teal-400"></i> SIEM Investigation
            </h3>
            <button onclick="document.getElementById('siem-row-body').classList.toggle('hidden');
                             this.querySelector('i').setAttribute('data-lucide',
                                 document.getElementById('siem-row-body').classList.contains('hidden')
                                 ? 'chevron-down' : 'chevron-up');
                             lucide.createIcons();"
                    class="text-slate-600 hover:text-teal-400 transition">
                <i data-lucide="chevron-up" class="w-3.5 h-3.5"></i>
            </button>
        </div>

        <div id="siem-row-body">
            <!-- Results will be injected here by SIEMModule._onResult() -->
            <div id="siem-results-panel"
                 class="text-[11px] text-slate-600 italic min-h-[24px]">
                No investigation run yet — use the SIEM panel on the right.
            </div>
        </div>
    </div>

    <!-- Job log -->
    <div id="job-log"
         class="hidden fixed bottom-4 right-4 w-80 max-h-40 overflow-y-auto
                bg-slate-950/95 border border-slate-700 rounded-lg p-3
                space-y-0.5 z-50 shadow-2xl"></div>

</div>
