<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PivotLens</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/tab_logo.gif') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #e2e8f0; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.05); }
        .mono { font-family: 'JetBrains Mono', monospace; }
        #cy { width: 100%; height: 500px; background: #0f172a; border-radius: 0.75rem; border: 1px solid #1e293b; }
        input[type="datetime-local"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    {% include 'header.html' %}

    {% include 'settings.html' %}

    <div class="flex flex-1 overflow-hidden">
        
        {% include 'left_navbar.html' %}

        <main class="flex-1 flex flex-col min-w-0 bg-slate-950/50 overflow-y-auto">

            {% include 'tabs.html' %}

            <div id="case-container"></div>

        </main>

        {% include 'right_navbar.html' %}

    </div>    
</body>
<script src="{{ url_for('static', filename='js/modules/graph.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/tabs.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/case.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/settings.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</html>
