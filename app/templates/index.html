<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argos</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/argos-favicon.svg') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/argos-theme.css') }}">
</head>
<body class="h-screen flex overflow-hidden argos-body">

    {% include 'settings.html' %}

    <div class="flex flex-1 overflow-hidden">
        {% include 'left_navbar.html' %}
        <main class="flex-1 flex flex-col min-w-0 overflow-hidden argos-main">
            {% include 'tabs.html' %}
            <div id="case-container" class="flex-1 overflow-y-auto"></div>
        </main>
        {% include 'right_navbar.html' %}
    </div>

    <script>
        // Init theme from localStorage before paint
        (function() {
            const t = localStorage.getItem('argos-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</body>
<!-- 1. Utilities -->
<script src="{{ url_for('static', filename='js/modules/secretstore.js') }}"></script>
<!-- 2. UI modules -->
<script src="{{ url_for('static', filename='js/modules/graph.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/tabs.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/case.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/case_header.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/case_actions.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/misp_instances.js') }}"></script>
    <script src="{{ url_for('static', filename='js/modules/siem_instances.js') }}"></script>
    <script src="{{ url_for('static', filename='js/modules/es_instances.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/settings.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/siem.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/correlation.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/qualif.js') }}"></script>
<script src="{{ url_for('static', filename='js/modules/ioc_input.js') }}"></script>
<!-- 3. Sidebar (registry-driven) -->
<script src="{{ url_for('static', filename='js/modules.js') }}"></script>
<!-- 4. Bootstrap (awaits registry) -->
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</html>
